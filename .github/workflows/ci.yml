name: CI
on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      - name: Verify remote entry exists
        run: test -f dist/telemed-ia-medical-consultation-portal/browser/remoteEntry.json
